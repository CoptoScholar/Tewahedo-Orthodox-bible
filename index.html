<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>መጽሐፍ ቅዱስ | ተዋሕዶ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --brown: #24140b;
  --dark: #180d07;
  --gold: #d9a747;
  --light-gold: #f1c875;
  --parchment: #f2dfb9;
  --ink: #38200e;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--brown);
  color: var(--parchment);
  font-family: 'Noto Serif Ethiopic', serif;
}

header {
  min-height: 125px;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  gap: 20px;
  border: 3px double var(--gold);
  background: linear-gradient(110deg, #180d07, #382013, #180d07);
}

.brand {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo {
  width: 105px;
  height: 105px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 4px double var(--gold);
  overflow: hidden;
  background: #382013;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand h2 {
  font-size: clamp(19px, 4vw, 32px);
  color: var(--light-gold);
}

.header-label {
  margin-left: auto;
  color: var(--gold);
  font-weight: bold;
}

main {
  max-width: 1050px;
  margin: auto;
  padding: 35px 22px;
}

.hero {
  text-align: center;
  padding: 75px 15px 60px;
  margin-bottom: 25px;
  border-bottom: 2px solid var(--gold);
  background:
    linear-gradient(#211209bb, #211209dd),
    url("church-background.jpg") center/cover;
}

.hero h1 {
  font-size: clamp(38px, 8vw, 78px);
  color: #f5dfae;
  text-shadow: 0 4px 12px #000;
}

.hero p {
  color: var(--light-gold);
  font-size: clamp(14px, 3vw, 23px);
  margin-top: 18px;
  line-height: 2;
}

.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 20px auto;
}

.ornament span {
  width: min(25%, 240px);
  height: 3px;
  background: var(--gold);
}

.coptic-cross {
  width: 65px;
  height: 65px;
  fill: var(--light-gold);
}

.bible-box {
  background: linear-gradient(#f4e4c7ee, #ead3a7ee);
  color: var(--ink);
  border: 5px double #a97930;
  outline: 1px solid var(--gold);
  outline-offset: -12px;
  padding: 45px 30px;
  border-radius: 9px;
}

.bible-box h2 {
  font-size: clamp(22px, 5vw, 37px);
  text-align: center;
  margin-bottom: 25px;
}

.search {
  width: 100%;
  padding: 17px;
  border: 2px solid #b58a50;
  background: #fff8eb;
  border-radius: 12px;
  font-family: inherit;
  font-size: 17px;
  color: var(--ink);
  margin-bottom: 25px;
}

.testament {
  margin-top: 30px;
}

.testament h3 {
  text-align: center;
  font-size: 27px;
  color: #71451d;
  padding: 15px;
  border-bottom: 2px solid #b58a50;
  margin-bottom: 20px;
}

.book-count {
  text-align: center;
  font-size: 14px;
  margin-top: -10px;
  margin-bottom: 20px;
  color: #79572e;
}

.books {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.book {
  width: 100%;
  padding: 16px 12px;
  background: linear-gradient(#f5cf82, #dca94e);
  border: 3px double #8b5c20;
  border-radius: 10px;
  text-align: center;
  color: var(--ink);
  font-family: inherit;
  cursor: pointer;
  transition: .2s;
}

.book:hover {
  transform: translateY(-3px);
  filter: brightness(1.08);
}

.book .amharic {
  display: block;
  font-size: 19px;
  font-weight: bold;
}

.book .english {
  display: block;
  font-size: 13px;
  margin-top: 5px;
}

.book.selected {
  background: #8b5c20;
  color: white;
}

.reader {
  display: none;
  margin-top: 30px;
  padding: 25px;
  background: #fff8eb;
  border: 3px double #a97930;
  border-radius: 10px;
  text-align: center;
}

.reader.active {
  display: block;
}

.reader h3 {
  color: #71451d;
  font-size: 25px;
  margin-bottom: 12px;
}

.reader p {
  line-height: 2;
}

.info {
  margin-top: 40px;
  padding: 35px 20px;
  text-align: center;
  border: 3px double var(--gold);
  background: #1b0f08;
}

.info h3 {
  color: var(--light-gold);
  font-size: 26px;
}

.info p {
  color: var(--parchment);
  line-height: 2.3;
  margin-top: 18px;
  font-size: 15px;
}

footer {
  text-align: center;
  padding: 30px 15px;
  border-top: 2px solid var(--gold);
  color: var(--light-gold);
  font-size: 16px;
}

@media(max-width: 550px) {
  header {
    padding: 12px;
    min-height: 85px;
  }

  .logo {
    width: 62px;
    height: 62px;
  }

  .brand {
    gap: 10px;
  }

  main {
    padding: 20px 12px;
  }

  .hero {
    padding: 55px 10px;
  }

  .bible-box {
    padding: 35px 17px;
  }

  .books {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

      <button class="book" data-name="Abtilis">
        <span class="amharic">አብጥሊስ</span>
        <span class="english">Abtilis</span>
      </button>

      <button class="book" data-name="First Book of Covenant">
        <span class="amharic">መጽሐፈ ኪዳን 1</span>
        <span class="english">First Book of Covenant</span>
      </button>

      <button class="book" data-name="Second Book of Covenant">
        <span class="amharic">መጽሐፈ ኪዳን 2</span>
        <span class="english">Second Book of Covenant</span>
      </button>

      <button class="book" data-name="Clement">
        <span class="amharic">ቀሌምንጦስ</span>
        <span class="english">Clement</span>
      </button>

      <button class="book" data-name="Didascalia">
        <span class="amharic">ዲዳስቅልያ</span>
        <span class="english">Didascalia</span>
      </button>

  </section>

  <div class="reader" id="reader">
    <h3 id="selectedTitle"></h3>
    <p id="readerMessage">
      መጽሐፉን መርጠዋል።
    </p>
  </div>

</section>

<section class="info">
  <div class="ornament">
    <span></span>
    <svg class="coptic-cross" viewBox="0 0 100 100">
      <path d="M39 5 H61 V34 H95 V43 L85 50 L95 57 V66 H61 V95 H39 V66 H5 V57 L15 50 L5 43 V34 H39 Z"/>
    </svg>
    <span></span>
  </div>

  <h3>ስለ ፕሮጀክቱ</h3>

  <p>
    የቅዱሳት መጻሕፍትን ቃል
    ለማንበብና ለማጥናት
    የተዘጋጀ የኢትዮጵያ
    ኦርቶዶክስ ተዋሕዶ
    የመጽሐፍ ቅዱስ ፕሮጀክት።
  </p>
</section>

</main>

<footer>
  <div class="ornament">
    <span></span>
    <svg class="coptic-cross" viewBox="0 0 100 100">
      <path d="M39 5 H61 V34 H95 V43 L85 50 L95 57 V66 H61 V95 H39 V66 H5 V57 L15 50 L5 43 V34 H39 Z"/>
    </svg>
    <span></span>
  </div>

  <p>በእምነት · በቃሉ · በትውፊት</p>
</footer>

<script>

// Search all books
const search = document.getElementById("search");

search.addEventListener("input", function() {

  const query = this.value.toLowerCase();

  document.querySelectorAll(".book").forEach(book => {

    const name = book.dataset.name.toLowerCase();
    const text = book.innerText.toLowerCase();

    book.style.display =
      name.includes(query) || text.includes(query)
      ? "block"
      : "none";

  });

});

// Select a book
document.querySelectorAll(".book").forEach(book => {

  book.addEventListener("click", function() {

    document.querySelectorAll(".book").forEach(item => {
      item.classList.remove("selected");
    });

    this.classList.add("selected");

    const amharic = this.querySelector(".amharic").innerText;
    const english = this.querySelector(".english").innerText;

    document.getElementById("selectedTitle").innerText =
      amharic + " — " + english;

    document.getElementById("readerMessage").innerText =
      "ይህ መጽሐፍ ተመርጧል። የምዕራፍና የቁጥር ጽሑፎች ከመጽሐፉ የተረጋገጠ የጽሑፍ ምንጭ ጋር ሲገናኙ እዚህ ይታያሉ።";

    document.getElementById("reader").classList.add("active");

    document.getElementById("reader").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  });

});

</script>

</body>
</html>
