<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>መጽሐፍ ቅዱስ | ተዋሕዶ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #160f0b;
  --panel: #241810;
  --panel2: #302117;
  --gold: #c9a45b;
  --gold-light: #e6c77d;
  --paper: #e9d9b5;
  --text: #f3e9d5;
  --muted: #bca987;
  --border: #70532d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  background:
    linear-gradient(rgba(18,11,7,.88), rgba(18,11,7,.94)),
    url("church-background.jpg") center/cover fixed;
  font-family: "Noto Serif Ethiopic", serif;
}

header {
  padding: 24px 18px;
  text-align: center;
  background: rgba(20,12,8,.96);
  border-bottom: 1px solid var(--gold);
}

header h1 {
  margin: 0;
  color: var(--gold-light);
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 16px;
}

.hero {
  text-align: center;
  padding: 40px 15px 30px;
}

.hero h2 {
  color: var(--gold-light);
  font-size: 29px;
  margin: 5px 0;
}

.hero p {
  color: var(--muted);
  margin: 12px 0;
}

.search-box {
  margin: 20px auto 28px;
  max-width: 650px;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid var(--gold);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: var(--gold-light);
}

.testament-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-bottom: 22px;
}

.testament-button {
  padding: 20px 10px;
  background: linear-gradient(145deg, #3a2819, #21150e);
  border: 1px solid var(--gold);
  border-radius: 9px;
  color: var(--gold-light);
  font-family: inherit;
  font-size: 19px;
  cursor: pointer;
  transition: .2s;
}

.testament-button:hover,
.testament-button.active {
  background: #594025;
  border-color: var(--gold-light);
}

.book-panel,
.reader {
  background: rgba(35,24,16,.96);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 22px;
}

.panel-heading {
  color: var(--gold-light);
  text-align: center;
  margin-top: 0;
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}

.book-button {
  padding: 13px 12px;
  background: #302116;
  border: 1px solid #6f512d;
  border-radius: 6px;
  color: var(--text);
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  transition: .2s;
}

.book-button:hover,
.book-button.selected {
  background: #594025;
  border-color: var(--gold-light);
  color: var(--gold-light);
}

.book-button .amharic {
  display: block;
  font-size: 15px;
}

.book-button .english {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.reader h2 {
  color: var(--gold-light);
  text-align: center;
}

.reader-content {
  min-height: 180px;
  padding: 15px;
  color: var(--paper);
  line-height: 2;
  white-space: pre-wrap;
}

.reader-placeholder {
  text-align: center;
  color: var(--muted);
  padding: 45px 10px;
}

footer {
  text-align: center;
  padding: 25px 15px;
  margin-top: 35px;
  background: rgba(15,9,6,.95);
  border-top: 1px solid var(--gold);
  color: var(--muted);
  font-size: 13px;
}

footer strong {
  color: var(--gold-light);
}

.hidden {
  display: none !important;
}

@media(max-width:600px) {
  header h1 {
    font-size: 21px;
  }

  .hero h2 {
    font-size: 23px;
  }

  .testament-buttons {
    grid-template-columns: 1fr;
  }

  .book-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>መጽሐፍ ቅዱስ | ተዋሕዶ</h1>
  <p>በእምነት · በቃሉ · በትውፊት</p>
</header>

<main>

<section class="hero">
  <h2>ቅዱሳት መጻሕፍት</h2>
  <p>የቅዱሳት መጻሕፍትን ቃል ለማንበብና ለማጥናት</p>
</section>

<div class="search-box">
  <input
    type="search"
    id="search"
    placeholder="መጽሐፍ ፈልግ / Search books..."
    oninput="searchBooks()"
  >
</div>

<div class="testament-buttons">
  <button class="testament-button active"
    onclick="showTestament('old', this)">
    ብሉይ ኪዳን
  </button>

  <button class="testament-button"
    onclick="showTestament('new', this)">
    ሐዲስ ኪዳን
  </button>
</div>

<section class="book-panel" id="oldPanel">
  <h2 class="panel-heading">ብሉይ ኪዳን</h2>
  <div class="book-grid" id="oldBooks"></div>
</section>

<section class="book-panel hidden" id="newPanel">
  <h2 class="panel-heading">ሐዲስ ኪዳን</h2>
  <div class="book-grid" id="newBooks"></div>
</section>

<section class="reader" id="reader">
  <h2 id="readerTitle">ቅዱሳት መጻሕፍት</h2>
  <div class="reader-content" id="readerContent">
    <div class="reader-placeholder">
      ለማንበብ ከላይ ካሉት መጻሕፍት አንዱን ይምረጡ።
    </div>
  </div>
</section>

<section class="book-panel">
  <h2 class="panel-heading">ስለ ፕሮጀክቱ</h2>
  <p style="text-align:center;line-height:2;color:var(--muted)">
    ይህ የተዋሕዶ ቅዱሳት መጻሕፍትን ለማንበብና
    ለማጥናት የተዘጋጀ ፕሮጀክት ነው።
  </p>
</section>

</main>

<footer>
  <strong>መጽሐፍ ቅዱስ | ተዋሕዶ</strong>
  <p>በእምነት · በቃሉ · በትውፊት</p>
</footer>

<script>

const oldBooks = [
  ["ዘፍጥረት","Genesis"],
  ["ዘጸአት","Exodus"],
  ["ዘሌዋውያን","Leviticus"],
  ["ዘኍልቍ","Numbers"],
  ["ዘዳግም","Deuteronomy"],
  ["ኢያሱ","Joshua"],
  ["መሳፍንት","Judges"],
  ["ሩት","Ruth"],
  ["1 ሳሙኤል","1 Samuel (1 Kingdoms)"],
  ["2 ሳሙኤል","2 Samuel (2 Kingdoms)"],
  ["1 ነገሥት","1 Kings (3 Kingdoms)"],
  ["2 ነገሥት","2 Kings (4 Kingdoms)"],
  ["1 ዜና መዋዕል","1 Chronicles"],
  ["2 ዜና መዋዕል","2 Chronicles"],
  ["መጽሐፈ ኩፋሌ","Jubilees"],
  ["ሄኖክ","Enoch"],
  ["ዕዝራ","Ezra"],
  ["ነህምያ","Nehemiah"],
  ["1 ዕዝራ","1 Esra"],
  ["2 ዕዝራ","2 Ezra"],
  ["ዕዝራ-ሸዓልቲኤል","Ezra-Shealtiel"],
  ["ጦቢት","Tobit"],
  ["ዮዲት","Judith"],
  ["1 መቃብያን","1 Meqabyan"],
  ["2 መቃብያን","2 Meqabyan"],
  ["3 መቃብያን","3 Meqabyan"],
  ["ኢዮብ","Job"],
  ["መዝሙረ ዳዊት","Psalms"],
  ["መዝሙር 151","Psalm 151"],
  ["ምሳሌ","Proverbs (1–24)"],
  ["ተግሣጽ","Reproof (Proverbs 25–31)"],
  ["ጥበብ","Wisdom of Solomon"],
  ["መክብብ","Ecclesiastes"],
  ["መኃልየ መኃልይ","Song of Solomon"],
  ["ሲራክ","Sirach"],
  ["ኢሳይያስ","Isaiah"],
  ["ሕዝቅኤል","Ezekiel"],
  ["ሆሴዕ","Hosea"],
  ["አሞጽ","Amos"],
  ["ሚክያስ","Micah"],
  ["ኢዮኤል","Joel"],
  ["አብድዩ","Obadiah"],
  ["ዮናስ","Jonah"],
  ["ናሆም","Nahum"],
  ["ዕንባቆም","Habakkuk"],
  ["ሶፎንያስ","Zephaniah"],
  ["ሐጌ","Haggai"],
  ["ዘካርያስ","Zechariah"],
  ["ሚልክያስ","Malachi"],
  ["ዮሴፍ ቤን ጉርዮን","Joseph Ben Gurion"],
  ["ኤርምያስ","Jeremiah"],
  ["ሰቆቃወ ኤርምያስ","Lamentations"],
  ["ዳንኤል","Daniel"],
  ["ባሮክ","Baruch"],
  ["መጽሐፈ አስቴር","Esther"]
];

const newBooks = [
  ["ማቴዎስ","Matthew"],
  ["ማርቆስ","Mark"],
  ["ሉቃስ","Luke"],
  ["ዮሐንስ","John"],
  ["የሐዋርያት ሥራ","Acts"],
  ["ሮሜ","Romans"],
  ["1 ቆሮንቶስ","1 Corinthians"],
  ["2 ቆሮንቶስ","2 Corinthians"],
  ["ገላትያ","Galatians"],
  ["ኤፌሶን","Ephesians"],
  ["ፊልጵስዩስ","Philippians"],
  ["ቆላስይስ","Colossians"],
  ["1 ተሰሎንቄ","1 Thessalonians"],
  ["2 ተሰሎንቄ","2 Thessalonians"],
  ["1 ጢሞቴዎስ","1 Timothy"],
  ["2 ጢሞቴዎስ","2 Timothy"],
  ["ቲቶ","Titus"],
  ["ፊልሞና","Philemon"],
  ["ዕብራውያን","Hebrews"],
  ["ያዕቆብ","James"],
  ["1 ጴጥሮስ","1 Peter"],
  ["2 ጴጥሮስ","2 Peter"],
  ["1 ዮሐንስ","1 John"],
  ["2 ዮሐንስ","2 John"],
  ["3 ዮሐንስ","3 John"],
  ["ይሁዳ","Jude"],
  ["ራእይ","Revelation"],
  ["ሥርዓተ ጽዮን","Sirate Tsion"],
  ["ትእዛዝ","Tizaz"],
  ["ግጽው","Gitzew"],
  ["አብጥሊስ","Abtilis"],
  ["1 መጽሐፈ ኪዳን","First Book of Covenant"],
  ["2 መጽሐፈ ኪዳን","Second Book of Covenant"],
  ["ቀሌምንጦስ","Clement"],
  ["ዲዳስቅልያ","Didascalia"]
];

function renderBooks(books, containerId) {
  const container = document.getElementById(containerId);

  books.forEach(([amharic, english]) => {
    const button = document.createElement("button");
    button.className = "book-button";
    button.dataset.search = (amharic + " " + english).toLowerCase();

    const amharicName = document.createElement("span");
    amharicName.className = "amharic";
    amharicName.textContent = amharic;

    const englishName = document.createElement("span");
    englishName.className = "english";
    englishName.textContent = english;

    button.appendChild(amharicName);
    button.appendChild(englishName);

    button.onclick = () => openBook(amharic, english, button);
    container.appendChild(button);
  });
}

function showTestament(which, button) {
  document.getElementById("oldPanel").classList.toggle("hidden", which !== "old");
  document.getElementById("newPanel").classList.toggle("hidden", which !== "new");

  document.querySelectorAll(".testament-button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");
}

function openBook(amharic, english, button) {
  document.querySelectorAll(".book-button").forEach(b => {
    b.classList.remove("selected");
  });

  button.classList.add("selected");

  document.getElementById("readerTitle").textContent =
    amharic + " — " + english;

  document.getElementById("readerContent").innerHTML = "";

  document.getElementById("reader").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function searchBooks() {
  const query = document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".book-button").forEach(button => {
    button.classList.toggle(
      "hidden",
      !button.dataset.search.includes(query)
    );
  });

  if (query) {
    document.getElementById("oldPanel").classList.remove("hidden");
    document.getElementById("newPanel").classList.remove("hidden");
  } else {
    document.getElementById("newPanel").classList.add("hidden");
  }
}

renderBooks(oldBooks, "oldBooks");
renderBooks(newBooks, "newBooks");

</script>

</body>
</html>
