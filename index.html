
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>መጽሐፍ ቅዱስ | ተዋሕዶ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#160f0b;
  --panel:#241810;
  --gold:#c9a45b;
  --gold-light:#e6c77d;
  --paper:#e9d9b5;
  --text:#f3e9d5;
  --muted:#bca987;
  --border:#70532d;
}

* { box-sizing:border-box; }

body {
  margin:0;
  color:var(--text);
  background:
    linear-gradient(rgba(18,11,7,.88),rgba(18,11,7,.94)),
    url("church-background.jpg") center/cover fixed;
  font-family:"Noto Serif Ethiopic",serif;
}

header {
  padding:24px 18px;
  text-align:center;
  background:rgba(20,12,8,.96);
  border-bottom:1px solid var(--gold);
}

header h1 {
  margin:0;
  color:var(--gold-light);
  font-size:25px;
}

header p {
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}

main {
  max-width:1100px;
  margin:auto;
  padding:25px 16px;
}

.hero {
  text-align:center;
  padding:40px 15px 30px;
}

.hero h2 {
  color:var(--gold-light);
  font-size:29px;
  margin:5px 0;
}

.hero p {
  color:var(--muted);
  margin:12px 0;
}

.search-box {
  margin:20px auto 28px;
  max-width:650px;
}

input {
  width:100%;
  padding:15px;
  border:1px solid var(--gold);
  border-radius:8px;
  background:var(--panel);
  color:var(--text);
  font-family:inherit;
  font-size:16px;
  outline:none;
}

input:focus { border-color:var(--gold-light); }

.testament-buttons {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-bottom:22px;
}

.testament-button {
  padding:20px 10px;
  background:linear-gradient(145deg,#3a2819,#21150e);
  border:1px solid var(--gold);
  border-radius:9px;
  color:var(--gold-light);
  font-family:inherit;
  font-size:19px;
  cursor:pointer;
}

.testament-button:hover,
.testament-button.active {
  background:#594025;
  border-color:var(--gold-light);
}

.book-panel,
.chapter-panel,
.reading-panel {
  background:rgba(35,24,16,.96);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  margin-bottom:22px;
}

.panel-heading {
  color:var(--gold-light);
  text-align:center;
  margin-top:0;
}

.book-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}

.book-button {
  padding:13px 12px;
  background:#302116;
  border:1px solid #6f512d;
  border-radius:6px;
  color:var(--text);
  text-align:left;
  font-family:inherit;
  cursor:pointer;
}

.book-button:hover {
  background:#594025;
  border-color:var(--gold-light);
  color:var(--gold-light);
}

.book-button .amharic {
  display:block;
  font-size:15px;
}

.book-button .english {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.chapter-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(65px,1fr));
  gap:12px;
  margin-top:25px;
}

.chapter-button {
  min-height:58px;
  background:#302116;
  border:1px solid var(--border);
  border-radius:7px;
  color:var(--gold-light);
  font-family:inherit;
  font-size:18px;
  cursor:pointer;
}

.chapter-button:hover {
  background:#594025;
  border-color:var(--gold-light);
}

.back-button {
  padding:11px 18px;
  background:#302116;
  border:1px solid var(--gold);
  border-radius:6px;
  color:var(--gold-light);
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
  margin-bottom:20px;
}

.back-button:hover { background:#594025; }

.screen-title {
  color:var(--gold-light);
  text-align:center;
  margin:10px 0 5px;
  font-size:24px;
}

.screen-subtitle {
  color:var(--muted);
  text-align:center;
  margin-bottom:25px;
  font-size:14px;
}

.reading-content {
  min-height:350px;
  padding:20px 10px;
  color:var(--paper);
  line-height:2.2;
  font-size:18px;
}

.verse {
  display:flex;
  gap:13px;
  align-items:flex-start;
  padding:9px 5px;
  border-bottom:1px solid rgba(112,83,45,.25);
}

.verse-number {
  flex-shrink:0;
  color:var(--gold-light);
  font-weight:700;
  min-width:25px;
}

.verse-text {
  flex:1;
}

.reader-placeholder {
  text-align:center;
  color:var(--muted);
  padding:70px 10px;
  line-height:2;
}

footer {
  text-align:center;
  padding:25px 15px;
  margin-top:35px;
  background:rgba(15,9,6,.95);
  border-top:1px solid var(--gold);
  color:var(--muted);
  font-size:13px;
}

footer strong { color:var(--gold-light); }

.hidden { display:none !important; }

@media(max-width:600px) {
  header h1 { font-size:21px; }
  .hero h2 { font-size:23px; }
  .testament-buttons { grid-template-columns:1fr; }
  .book-grid { grid-template-columns:1fr; }
  .chapter-grid { grid-template-columns:repeat(4,1fr); }
  .reading-content { font-size:17px; }
}
</style>
</head>

<body>

<header>
  <h1>መጽሐፍ ቅዱስ | ተዋሕዶ</h1>
  <p>በእምነት · በቃሉ · በትውፊት</p>
</header>

<main>

<section id="booksScreen">

  <section class="hero">
    <h2>ቅዱሳት መጻሕፍት</h2>
    <p>የቅዱሳት መጻሕፍትን ቃል ለማንበብና ለማጥናት</p>
  </section>

  <div class="search-box">
    <input
      type="search"
      id="search"
      placeholder="መጽሐፍ ፈልግ / Search books..."
      oninput="searchBooks()"
    >
  </div>

  <div class="testament-buttons">
    <button class="testament-button active"
      onclick="showTestament('old',this)">
      ብሉይ ኪዳን
    </button>

    <button class="testament-button"
      onclick="showTestament('new',this)">
      ሐዲስ ኪዳን
    </button>
  </div>

  <section class="book-panel" id="oldPanel">
    <h2 class="panel-heading">ብሉይ ኪዳን</h2>
    <div class="book-grid" id="oldBooks"></div>
  </section>

  <section class="book-panel hidden" id="newPanel">
    <h2 class="panel-heading">ሐዲስ ኪዳን</h2>
    <div class="book-grid" id="newBooks"></div>
  </section>

  <section class="book-panel">
    <h2 class="panel-heading">ስለ ፕሮጀክቱ</h2>
    <p style="text-align:center;line-height:2;color:var(--muted)">
      ይህ የተዋሕዶ ቅዱሳት መጻሕፍትን ለማንበብና
      ለማጥናት የተዘጋጀ ፕሮጀክት ነው።
    </p>
  </section>

</section>

<section id="chaptersScreen" class="chapter-panel hidden">

  <button class="back-button" onclick="goToBooks()">
    ← ወደ መጻሕፍት ተመለስ
  </button>

  <h2 class="screen-title" id="chapterBookTitle"></h2>
  <p class="screen-subtitle">ምዕራፍ ይምረጡ</p>

  <div class="chapter-grid" id="chapterGrid"></div>

</section>

<section id="readingScreen" class="reading-panel hidden">

  <button class="back-button" onclick="goToChapters()">
    ← ወደ ምዕራፎች ተመለስ
  </button>

  <h2 class="screen-title" id="readingBookTitle"></h2>
  <p class="screen-subtitle" id="readingChapterTitle"></p>

  <div class="reading-content" id="readingContent"></div>

</section>

</main>

<footer>
  <strong>መጽሐፍ ቅዱስ | ተዋሕዶ</strong>
  <p>በእምነት · በቃሉ · በትውፊት</p>
</footer>

      "፤ ምድርም ዘርን የሚሰጥ ሣርንና ቡቃያን እንደ ወገኑ ዘሩም ያለበትን ፍሬን የሚያፈራ ዛፍን እንደ ወገኑ አበቀለች። እግዚአብሔርም ያ መልካም እንደ ሆነ አየ።",
      "፤ ማታም ሆነ ጥዋትም ሆነ፥ ሦስተኛ ቀን።",
      "፤ እግዚአብሔርም አለ። ቀንና ሌሊትን ይለዩ ዘንድ ብርሃናት በሰማይ ጠፈር ይሁኑ፤ ለምልክቶች ለዘመኖች ለዕለታት ለዓመታትም ይሁኑ፤",
      "፤ በምድር ላይ ያበሩ ዘንድ በሰማይ ጠፈር ብርሃናት ይሁኑ፤ እንዲሁም ሆነ።",
      "፤ እግዚአብሔርም ሁለት ታላላቆች ብርሃናትን አደረገ፤ ትልቁ ብርሃን በቀን እንዲሠለጥን፥ ትንሹም ብርሃን በሌሊት እንዲሰለጥን፤ ከዋክብትንም ደግሞ አደረገ።",
      "፤ እግዚአብሔርም በምድር ላይ ያበሩ ዘንድ በሰማይ ጠፈር አኖራቸው፤",
      "፤ በቀንም በሌሊትም እንዲሠለጥኑ፥ ብርሃንንና ጨለማንም እንዲለዩ፤ እግዚአብሔርም ያ መልካም እንደ ሆነ አየ።",
      "፤ ማታም ሆነ ጥዋትም ሆነ፥ አራተኛ ቀን።",
      "፤ እግዚአብሔርም አለ። ውኃ ሕያው ነፍስ ያላቸውን ተንቀሳቃሾች ታስገኝ፥ ወፎችም ከምድር በላይ ከሰማይ ጠፈር በታች ይብረሩ።",
      "፤ እግዚአብሔርም ታላላቆች አንበሪዎችን፥ ውኃይቱ እንደ ወገኑ ያስገኘቻቸውንም ተንቀሳቃሾቹን ሕያዋን ፍጥረታት ሁሉ፥ እንደ ወገኑ የሚበሩትንም ወፎች ሁሉ ፈጠረ፤ እግዚአብሔርም ያ መልካም እንደ ሆነ አየ።",
      "፤ እግዚአብሔርም እንዲህ ብሎ ባረካቸው። ብዙ ተባዙም የባሕርንም ውኃ ሙሉአት፤ ወፎችም በምድር ላይ ይብዙ።",
      "፤ ማታም ሆነ ጥዋትም ሆነ፥ አምስተኛ ቀን።",
      "፤ እግዚአብሔርም አለ። ምድር ሕያዋን ፍጥረታትን እንደ ወገኑ፥ እንስሳትንና ተንቀሳቃሾችን የምድር አራዊትንም እንደ ወገኑ፥ ታውጣ፤ እንዲሁም ሆነ።",
      "፤ እግዚአብሔር የምድር አራዊትን እንደ ወገኑ አደረገ፥ እንስሳውንም እንደ ወገኑ፥ የመሬት ተንቀሳቃሾችንም እንደ ወገኑ አደረገ፤ እግዚአብሔርም ያ መልካም እንደ ሆነ አየ።",
      "፤ እግዚአብሔርም አለ። ሰውን በመልካችን እንደ ምሳሌአችን እንፍጠር፤ የባሕር ዓሦችንና የሰማይ ወፎችን፥ እንስሳትንና ምድርን ሁሉ፥ በምድር ላይ የሚንቀሳቀሱትንም ሁሉ ይግዙ።",
      "፤ እግዚአብሔርም ሰውን በመልኩ ፈጠረ፤ በእግዚአብሔር መልክ ፈጠረው፤ ወንድና ሴት አድርጎ ፈጠራቸው።",
      "፤ እግዚአብሔርም ባረካቸው፥ እንዲህም አላቸው። ብዙ፥ ተባዙ፥ ምድርንም ሙሉአት፥ ግዙአትም፤ የባሕርን ዓሦችና የሰማይን ወፎች በምድር ላይ የሚንቀሳቀሱትንም ሁሉ ግዙአቸው።",
      "፤ እግዚአብሔርም አለ። እነሆ መብል ይሆናችሁ ዘንድ በምድር ፊት ሁሉ ላይ ዘሩ በእርሱ ያለውን ሐመልማል ሁሉ፥ የዛፍን ፍሬ የሚያፈራውንና ዘር ያለውንም ዛፍ ሁሉ ሰጠኋችሁ፤",
      "፤ ለምድርም አራዊት ሁሉ፥ ለሰማይም ወፎች ሁሉ፥ ሕያው ነፍስ ላላቸው ለምድር ተንቀሳቃሾችም ሁሉ የሚበቅለው ሐመልማል ሁሉ መብል ይሁንላቸው፤ እንዲሁም ሆነ።",
      "፤ እግዚአብሔርም ያደረገውን ሁሉ አየ፥ እነሆም እጅግ መልካም ነበረ። ማታም ሆነ ጥዋትም ሆነ፥ ስድስተኛ ቀን።"
    ]

  }

};

/* CURRENT READER STATE */

let selectedBook = null;
let selectedChapter = null;
let currentTestament = "old";

/* DISPLAY BOOKS */

function renderBooks(books,containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  books.forEach(([amharic,english]) => {
    const button = document.createElement("button");
    button.className = "book-button";
    button.dataset.search = (amharic+" "+english).toLowerCase();

    const am = document.createElement("span");
    am.className = "amharic";
    am.textContent = amharic;

    const en = document.createElement("span");
    en.className = "english";
    en.textContent = english;

    button.append(am,en);
    button.onclick = () => openBook(amharic,english);

    container.appendChild(button);
  });
}

/* TESTAMENT SWITCHING */

function showTestament(which,button) {
  currentTestament = which;

  document.getElementById("oldPanel")
    .classList.toggle("hidden",which !== "old");

  document.getElementById("newPanel")
    .classList.toggle("hidden",which !== "new");

  document.querySelectorAll(".testament-button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");
}

/* OPEN BOOK */

function openBook(amharic,english) {
  selectedBook = {amharic,english};

  const count = chapterCounts[english] || 1;

  document.getElementById("chapterBookTitle").textContent =
    amharic+" — "+english;

  const grid = document.getElementById("chapterGrid");
  grid.innerHTML = "";

  for(let i=1;i<=count;i++) {
    const button = document.createElement("button");
    button.className = "chapter-button";
    button.textContent = i;
    button.onclick = () => openChapter(i);
    grid.appendChild(button);
  }

  document.getElementById("booksScreen").classList.add("hidden");
  document.getElementById("chaptersScreen").classList.remove("hidden");
  document.getElementById("readingScreen").classList.add("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

/* OPEN CHAPTER */

function openChapter(chapter) {
  selectedChapter = chapter;

  document.getElementById("readingBookTitle").textContent =
    selectedBook.amharic+" — "+selectedBook.english;

  document.getElementById("readingChapterTitle").textContent =
    "ምዕራፍ "+chapter;

  const content = document.getElementById("readingContent");
  content.innerHTML = "";

  const verses =
    scriptureData[selectedBook.english]?.[chapter];

  if(verses && verses.length) {

    verses.forEach((verse,index) => {
      const row = document.createElement("div");
      row.className = "verse";

      const number = document.createElement("span");
      number.className = "verse-number";
      number.textContent = index+1;

      const text = document.createElement("span");
      text.className = "verse-text";
      text.textContent = verse;

      row.append(number,text);
      content.appendChild(row);
    });

  } else {

    const placeholder = document.createElement("div");
    placeholder.className = "reader-placeholder";
    placeholder.textContent =
      "የዚህ ምዕራፍ ጽሑፍ ገና አልተጨመረም።";

    content.appendChild(placeholder);
  }

  document.getElementById("booksScreen").classList.add("hidden");
  document.getElementById("chaptersScreen").classList.add("hidden");
  document.getElementById("readingScreen").classList.remove("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

/* BACK BUTTONS */

function goToBooks() {
  document.getElementById("booksScreen").classList.remove("hidden");
  document.getElementById("chaptersScreen").classList.add("hidden");
  document.getElementById("readingScreen").classList.add("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

function goToChapters() {
  document.getElementById("booksScreen").classList.add("hidden");
  document.getElementById("chaptersScreen").classList.remove("hidden");
  document.getElementById("readingScreen").classList.add("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

/* SEARCH */

function searchBooks() {
  const query = document.getElementById("search")
    .value.toLowerCase().trim();

  document.querySelectorAll(".book-button").forEach(button => {
    button.classList.toggle(
      "hidden",
      !button.dataset.search.includes(query)
    );
  });

  if(query) {
    document.getElementById("oldPanel").classList.remove("hidden");
    document.getElementById("newPanel").classList.remove("hidden");
  } else {
    document.getElementById("oldPanel").classList.remove("hidden");
    document.getElementById("newPanel").classList.add("hidden");
  }
}

/* INITIALIZE */

renderBooks(oldBooks,"oldBooks");
renderBooks(newBooks,"newBooks");

</script>
